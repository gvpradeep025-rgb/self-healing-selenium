name: Self-Healing Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit and UI tests in headless Chrome
        run: mvn -B clean test -Dheadless=true

      - name: Upload healing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-report
          path: target/healing-report/

      - name: Upload TestNG report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-report
          path: target/surefire-reports/
